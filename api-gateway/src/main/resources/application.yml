server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "https://event-driven-microservices.onrender.com"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: https://auth-service-1c5d.onrender.com
          predicates:
            - Path=/api/auth/**
        - id: profile-service
          # Note: You will need to update this URI once your profile-service is deployed to Render!
          uri: http://profile-service:8082 
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthentication
