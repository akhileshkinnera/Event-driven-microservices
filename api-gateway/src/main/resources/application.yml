server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "https://event-driven-microservices.onrender.com"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: https://auth-service-1c5d.onrender.com
          predicates:
            - Path=/api/auth/**
        - id: profile-service
          uri: https://profile-service-9s5o.onrender.com 
          predicates:
            - Path=/api/profiles/**
          filters:
            - JwtAuthentication
